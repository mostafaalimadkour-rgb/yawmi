<style>
:root{
  --bg:#EAF3FB; --surface:#FFFFFF; --ink:#16283A; --muted:#566B80; --line:#D3E0EC;
  --good:#1F8A4C; --warn:#C27A00; --bad:#C93C3C; --sun:#FFC23D; --accent:#2F6FB0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1825; --surface:#172536; --ink:#E6EEF7; --muted:#9BB0C5; --line:#2A3D52;
    --good:#3FBF74; --warn:#E5A23A; --bad:#EE6A6A; --accent:#6AA8E8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1825; --surface:#172536; --ink:#E6EEF7; --muted:#9BB0C5; --line:#2A3D52;
  --good:#3FBF74; --warn:#E5A23A; --bad:#EE6A6A; --accent:#6AA8E8; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:2.6rem;font-weight:800;margin:4px 0 0;line-height:1.1}
h2{font-size:1.5rem;margin:0;line-height:1.2}
h3{font-size:1.2rem;margin:26px 0 10px}
.sub{color:var(--muted);margin:2px 0 0}
.arc{margin:8px 0 4px}
.arc svg{width:100%;height:auto;display:block}
.kids{display:grid;gap:12px;margin-top:8px}
.kid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:start;background:var(--surface);border:2px solid var(--line);border-inline-start:10px solid var(--c);border-radius:22px;padding:14px 16px}
.av{font-size:2.6rem;line-height:1;grid-row:span 3}
.nm{font-size:1.3rem;font-weight:700}
.meta{display:flex;gap:14px;color:var(--muted);font-size:.95rem}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.parentBtn{margin-top:22px;width:100%;padding:14px;border-radius:16px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{border:0;background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:600;border:2px solid var(--line)}
.who{display:flex;align-items:center;gap:12px}
.who .av{font-size:3rem}
.stats{display:flex;gap:16px;color:var(--muted);flex-wrap:wrap}
.now{background:var(--c);color:#fff;border-radius:28px;padding:20px;margin-top:10px}
.now .lbl{opacity:.85;font-weight:600}
.now .big{font-size:3.4rem;line-height:1.1}
.now .ttl{font-size:1.7rem;font-weight:800;line-height:1.2;margin:4px 0}
.now .when{opacity:.9}
.now button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:18px;background:#fff;color:var(--c);font-size:1.25rem;font-weight:800}
.now .state{margin-top:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;font-weight:700}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:4.6em 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.tasks li.cur{border-color:var(--c)}
.tasks .tm{color:var(--muted);font-size:.9rem}
.tasks .tt{font-weight:600;line-height:1.3}
.tasks .pts{color:var(--muted);font-size:.85rem;font-weight:400}
.chip{display:inline-block;border-radius:99px;padding:4px 10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:8px 14px;font-weight:700;background:var(--c,var(--accent));color:#fff;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.good{background:var(--good)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.store{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rw{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:6px;text-align:center}
.rw .e{font-size:2.2rem;line-height:1}
.rw .c{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.8rem;margin-inline-start:4px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1;min-width:120px}
.muted{color:var(--muted)}
.kpick{display:flex;gap:8px;flex-wrap:wrap}
.kpick button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;font-weight:700}
.kpick button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.beh{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;text-align:center;font-weight:600}
.beh b{display:block;font-size:1.1rem}
.beh.plus b{color:var(--good)} .beh.minus b{color:var(--bad)}
input[type=text],input[type=number],input[type=time],input[type=password],input:not([type]){width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
label.f{display:grid;gap:4px;font-weight:600;margin-bottom:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:2px solid var(--line);border-radius:12px;padding:4px 10px;display:flex;gap:6px;align-items:center}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.5)}
.dlg{padding:18px;max-height:80vh;overflow:auto}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.chart i{display:block;width:100%;background:var(--c);border-radius:6px 6px 2px 2px;min-height:2px}
.chart span{font-size:.7rem;color:var(--muted)}
.pin{display:grid;place-items:center;gap:16px;margin-top:30px}
.dots{display:flex;gap:12px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:72px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:700}
#banner{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;background:var(--warn);color:#fff;font-size:1.25rem;font-weight:800;text-align:center;transform:translateY(-110%);transition:transform .3s}
#banner.show{transform:none}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#banner,#toast{transition:none}}
.quran{font-family:"Amiri","Traditional Arabic",serif;font-size:1.55rem;line-height:2.3;margin:8px 0}
.ph{border-radius:50%;object-fit:cover;display:block}
.ph{background-size:cover;background-position:center;background-color:var(--line)}
.ph.av{width:64px;height:64px;border:3px solid var(--c,var(--line))}
.who .ph.av{width:88px;height:88px;border-width:4px}
.ph.mini{width:26px;height:26px;display:inline-block;vertical-align:middle;border-radius:50%}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stars button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;font-weight:700}
.stars small{display:block;color:var(--muted);font-weight:600}
.dtimes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.dtimes label{display:grid;gap:2px;font-weight:600}
summary{cursor:pointer}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.score div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;display:grid}
.score .n{font-size:1.35rem;font-weight:800;color:var(--c);line-height:1.3}
.score span:last-child{font-size:.75rem;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px}
.msg{max-width:80%;padding:6px 12px;border-radius:16px;background:var(--bg);align-self:flex-end}
.msg.me{align-self:flex-start;background:var(--c,var(--accent));color:#fff}
.msg.rem{border:2px solid var(--warn)}
.msg small{display:block;opacity:.75;font-size:.75rem}
.lang{float:inline-end;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px;font-weight:700;margin-top:6px}
.wallet .bal{font-size:2.4rem;font-weight:800;color:var(--c)}
</style>
</head>

function tr(x){if(LANG!=='en'||!x||!/[\u0600-\u06FF]/.test(x))return x;DK??=Object.keys(DICT).filter(k=>k.length>=3).sort((a,b)=>b.length-a.length);let o=String(x);for(const k of DK)if(o.includes(k))o=o.split(k).join(DICT[k]);return o.replace(/،/g,',').replace(/؟/g,'?')}
function trDom(root){if(LANG!=='en'||!root||!document.createTreeWalker)return;const w=document.createTreeWalker(root,4,{acceptNode:n=>n.parentElement&&n.parentElement.closest('.quran,.raw')?2:1});let n;while(n=w.nextNode()){if(/[\u0600-\u06FF]/.test(n.nodeValue))n.nodeValue=tr(n.nodeValue)}

function diff(a,b,p,out){
  if(isObj(a)&&isObj(b)){for(const k in b){if(!(k in a))out.push([p.concat(k),b[k]]);else diff(a[k],b[k],p.concat(k),out)}for(const k in a)if(!(k in b))out.push([p.concat(k),DEL]);return}
  const ja=JSON.stringify(a),jb=JSON.stringify(b);if(ja===jb)return;
  if(Array.isArray(a)&&Array.isArray(b)&&b.length>a.length&&JSON.stringify(b.slice(0,a.length))===ja){out.push([p,{__u:b.slice(a.length)}]);return}
  out.push([p,b])}

/* ---------- the day arc ---------- */
function arc(k){
  const n=nowM(),A=270,B=1290,p=Math.min(1,Math.max(0,(n-A)/(B-A))),night=n<A||n>B;
  const pt=q=>{const th=Math.PI*q;return[150+130*Math.cos(th),104-82*Math.sin(th)]};
  const c=k?k.color:'var(--accent)';
  const[sx,sy]=pt(p);
  let dots='';
  if(k)kidTasks(k).forEach(t=>{const q=Math.min(1,Math.max(0,(m(T(t))-A)/(B-A)));const[x,y]=pt(q);const s=st(k.id,t.id);
    const f=s==='done'?'var(--good)':s==='pending'?'var(--warn)':(P(t,k.id)&&m(T(t))+t.dur<n?'var(--bad)':'var(--line)');
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${f}" stroke="var(--bg)" stroke-width="2"/>`});
  const done=p>0?`<path d="M280 104 A130 82 0 0 0 ${sx.toFixed(1)} ${sy.toFixed(1)}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`:'';
  const body=night?`<text x="${sx.toFixed(1)}" y="${(sy+9).toFixed(1)}" font-size="26" text-anchor="middle">🌙</text>`
    :`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="20" fill="var(--sun)" opacity=".25"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="12" fill="var(--sun)"/>`;
  return `<div class="arc"><svg viewBox="0 0 300 126" role="img" aria-label="مكان الشمس في اليوم">
    <path d="M280 104 A130 82 0 0 0 20 104" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
    ${done}${dots}${body}
    <text x="284" y="122" font-size="11" fill="var(--muted)" text-anchor="end" font-family="inherit">الفجر</text>
    <text x="16" y="122" font-size="11" fill="var(--muted)" text-anchor="start" font-family="inherit">النوم ٩:٣٠</text>
  </svg></div>`;
}

function markDone(kid,tid,note){setSt(kid,tid,'pending');if(note)S.notes[today()+'|'+kid+'|'+tid]=note;save();if(dlg.open)closeDlg();render();toast('تمام! اتبعتت للأهل يوافقوا')}
function startSpeed(kid,tid){S.timers[today()+'|'+kid+'|'+tid]=Date.now();save();render()}

function pinKey(x){if(x==='⌫')pinBuf=pinBuf.slice(0,-1);else if(x==='✓'){}else if(pinBuf.length<4)pinBuf+=x;
  if(pinBuf.length===4){if(pinBuf===S.pin){pinBuf='';if(view.arg==='setup'){setDevice('');go('setup');return}go('parent','ok');return}pinBuf='';toast('الرقم غلط')}render()}

/* ---------- parent ---------- */
const TABS=[['ok','الموافقات'],['chat','الرسايل'],['beh','ثواب وعقاب'],['tasks','المهام'],['week','خطة الأسبوع'],['rw','المكافآت'],['rep','التقرير'],['set','الإعدادات']];
function vParent(tab){
  const pc=pendingTasks().length+pendingReqs().length;
  const tabs=TABS.map(([k,l])=>`<button class="tab" aria-current="${k===tab}" onclick="go('parent','${k}')">${l}${k==='ok'&&pc?`<span class="badge">${pc}</span>`:''}${k==='chat'&&unreadP()?`<span class="badge">${unreadP()}</span>`:''}</button>`).join('');
  const body={ok:pOk,chat:pChat,beh:pBeh,tasks:pTasks,week:pWeek,rw:pRw,rep:pRep,set:pSet}[tab]();
  return `<div class="top"><button class="back" onclick="go('home')">خروج</button><h2>لوحة الأهل</h2></div><nav class="tabs">${tabs}</nav>${body}`;
}
function kidTag(k){return `<b style="color:${k.color}">${AV(k,'mini')} ${esc(k.name)}</b>`}
function pOk(){
  const pt=pendingTasks(),pr=pendingReqs(),dw=new Date().getDay();
  const rh=S.tasks.filter(t=>t.rate&&t.days.includes(dw)).flatMap(t=>S.kids.filter(k=>t.kids.includes(k.id)).map(k=>{const s=st(k.id,t.id),nt=S.notes[today()+'|'+k.id+'|'+t.id];
    return `<div class="card"><div>${kidTag(k)} ${esc(t.emoji)} ${esc(t.title)}</div>${s==='done'?`<div class="muted">اتقيّم النهارده ${esc(nt||'')}</div>`:`<div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rateKid('${k.id}','${t.id}',${n})" aria-label="${n} من 5">⭐ ${n}<small>+${Math.round(P(t,k.id)*n/5)}</small></button>`).join('')}</div>`}</div>`})).join('');
  const mh=isMealDay()?S.kids.map(k=>{const p=weekPct(k),ok=p>=S.meal.pct,paid=S.meal.paid[today()+'|'+k.id];return `<div class="card row"><span class="grow">${kidTag(k)} <span class="muted">التزام الأسبوع ${p}%</span></span>${paid?'<span class="chip ok">استلم ✓</span>':ok?`<button class="btn good" onclick="mealPay('${k.id}')">اديته ${S.meal.amount} جنيه</button>`:'<span class="chip no">مش مستحق</span>'}</div>`}).join(''):'';
  if(!pt.length&&!pr.length&&!rh&&!mh)return '<div class="card muted">مفيش حاجة مستنية موافقتك دلوقتي.</div>';
  const a=pt.map(({d,kid,t,note})=>{const k=kidById(kid),p=P(t,kid)+(fastOf(d,kid,t)?t.speedPts:0);return `<div class="card"><div>${kidTag(k)} خلّص: ${esc(t.emoji)} ${esc(t.title)}${note?` <span class="chip">${esc(note)}</span>`:''} ${d!==today()?`<span class="muted">(${d})</span>`:''}</div>
    <div class="row" style="margin-top:8px"><button class="btn good" onclick="okTask('${d}','${kid}','${t.id}',1)">${t.bonus?'حضر':'موافقة'} +${p}</button>${t.bonus?`<button class="btn good" onclick="okTask('${d}','${kid}','${t.id}',1,1)">حضر واتميز +${p+t.bonus}</button>`:`<button class="btn warn" onclick="okTask('${d}','${kid}','${t.id}',.5)">نص النقط</button>`}<button class="btn bad" onclick="noTask('${d}','${kid}','${t.id}')">لسه</button></div></div>`}).join('');
  const b=pr.map(q=>{const k=kidById(q.kid),r=S.rewards.find(x=>x.id===q.rid);if(!k||!r)return '';return `<div class="card"><div>${kidTag(k)} عايز: ${esc(r.emoji)} ${esc(r.title)} <span class="muted">(${r.num} نقطة، معاه ${k.points})</span></div>
    <div class="row" style="margin-top:8px"><button class="btn good" onclick="okReq('${q.id}')">موافقة</button><button class="btn bad" onclick="noReq('${q.id}')">مش دلوقتي</button></div></div>`}).join('');
  return `<div class="list">${mh?'<h3 style="margin-top:0">🍔 وجبة المدرسة النهارده</h3>'+mh:''}${rh?'<h3 style="margin-top:0">تقييم النهارده (للأب والأم بس)</h3>'+rh:''}${pt.length?'<h3>مهام خلصت</h3>'+a:''}${pr.length?'<h3>طلبات مكافآت</h3>'+b:''}</div>`;
}
function okTask(d,kid,tid,f,bon){const t=S.tasks.find(x=>x.id===tid);setSt(kid,tid,'done',d);const fs=fastOf(d,kid,t),p=Math.round(P(t,kid)*f)+(bon?t.bonus:0)+(fs?t.speedPts:0);addPts(kid,p,(f<1?'نص نقط: ':'')+t.title+(bon?' (تميّز)':'')+(fs?' ⚡':''));save();render();toast('+'+p+' نقطة')}
function rateKid(kid,tid,n){const t=S.tasks.find(x=>x.id===tid);setSt(kid,tid,'done');S.notes[today()+'|'+kid+'|'+tid]='⭐'.repeat(n);const p=Math.round(P(t,kid)*n/5);addPts(kid,p,t.title+' ('+n+'/5)');save();render();toast('+'+p+' نقطة')}
function pWeek(){
  const chips=DAYS.map((d,i)=>`<button style="--c:var(--accent)" aria-pressed="${i===selDay}" onclick="selDay=${i};render()">${d}</button>`).join('');
  const dd=new Date();dd.setDate(dd.getDate()+((selDay-dd.getDay()+7)%7));
  const rows=S.tasks.filter(t=>t.days.includes(selDay)).sort((a,b)=>m(T(a,dd))-m(T(b,dd))).map(t=>`<div class="card row"><span class="tm muted" style="width:4.6em">${fmt(T(t,dd))}</span><span class="grow"><b>${esc(t.emoji)} ${esc(t.title)}</b><br>${t.kids.map(id=>kidById(id)?AV(kidById(id),'mini'):'').join(' ')}</span><button class="btn ghost" onclick="editTask('${t.id}')">تعديل</button></div>`).join('');
  return `<div class="kpick">${chips}</div><button class="btn" style="width:100%;padding:12px;margin:12px 0" onclick="editTask('',${selDay})">+ نشاط ليوم ${DAYS[selDay]}</button><div class="list">${rows||'<div class="card muted">مفيش أنشطة اليوم ده.</div>'}</div>`;
}
function noTask(d,kid,tid){setSt(kid,tid,'rejected',d);save();render()}
function okReq(id){const q=S.requests.find(x=>x.id===id),k=kidById(q.kid),r=S.rewards.find(x=>x.id===q.rid);if(k.points<r.num){toast('النقط مش كفاية');return}addPts(k.id,-r.num,'مكافأة: '+r.title);q.status='ok';save();render();toast('اتخصم '+r.num+' نقطة')}
function noReq(id){S.requests.find(x=>x.id===id).status='no';save();render()}
function pChat(){
  const pick=S.kids.map(k=>{const u=(S.chat[k.id]||[]).filter(x=>x.from==='k'&&!x.seen).length;return `<button style="--c:${k.color}" aria-pressed="${k.id===selKid}" onclick="selKid='${k.id}';render()">${AV(k,'mini')} ${esc(k.name)}${u?`<span class="badge">${u}</span>`:''}</button>`}).join('');
  const k=kidById(selKid)||S.kids[0];let ch=0;(S.chat[k.id]||[]).forEach(x=>{if(x.from==='k'&&!x.seen){x.seen=true;ch=1}});if(ch)save();
  const quick=['يلا على الواجب 📚','وقت الصلاة 🕌','رتّب مكتبك 🗂️','البس بسرعة، التمرين قرب ⚡','يلا على السرير 😴'];
  return `<div class="kpick">${pick}</div><div class="row" style="margin:10px 0"><span class="muted">بتكتب باسم:</span>${['بابا','ماما'].map(n=>`<button class="tab" aria-current="${SENDER===n}" onclick="setSender('${n}')">${n}</button>`).join('')}</div>
  ${chatBox(k,'p')}<button class="btn warn" style="margin-top:8px;width:100%" onclick="sendRem('${k.id}')">ابعت المكتوب كتذكير 🔔</button>
  <h3>تذكير سريع</h3><div class="kpick">${quick.map((q,i)=>`<button onclick="sendMsg('${k.id}','p',tr(QUICK[${i}]),1)">${q}</button>`).join('')}</div>
  <p class="muted">التذكير بيظهر لـ${esc(k.name)} بصوت وشريط فوق الشاشة أول ما يفتح صفحته.</p>`;
}
const QUICK=['يلا على الواجب 📚','وقت الصلاة 🕌','رتّب مكتبك 🗂️','البس بسرعة، التمرين قرب ⚡','يلا على السرير 😴'];
function pBeh(){
  const pick=S.kids.map(k=>`<button style="--c:${k.color}" aria-pressed="${k.id===selKid}" onclick="selKid='${k.id}';render()">${AV(k,'mini')} ${esc(k.name)}</button>`).join('');

  const hist=S.history.filter(h=>h.kid===k.id).slice(-12).reverse().map(h=>`<div class="row"><span class="grow">${esc(h.reason)}</span><span class="chip ${h.pts>=0?'ok':'no'}">${h.pts>0?'+':''}${h.pts}</span></div>`).join('');
  return `<div class="kpick">${pick}</div><p class="muted">${esc(k.name)} معاه ${k.points} نقطة. اختار السلوك:</p><div class="bgrid">${bs}</div>

function applyBeh(id){const b=S.behaviors.find(x=>x.id===id);addPts(selKid,b.num,b.title);save();render();toast((b.num>0?'+':'')+b.num+L(' لـ',' for ')+kidById(selKid).name)}
function customBeh(){const r=document.getElementById('cr').value.trim(),p=parseInt(document.getElementById('cp').value,10);if(!r||!p){toast('اكتب السبب والنقط');return}addPts(selKid,p,r);save();render()}
function ptsText(t){const vals=S.kids.map(k=>P(t,k.id));return vals.every(v=>v===vals[0])?vals[0]+' نقطة':S.kids.map(k=>esc(k.name)+' '+P(t,k.id)).join('، ')}
function pTasks(){
  const rows=[...S.tasks].sort((a,b)=>m(a.time)-m(b.time)).map(t=>`<div class="card row"><span class="grow"><b>${esc(t.emoji)} ${esc(t.title)}</b><br><span class="muted">${fmt(t.time)}، ${t.dur} دقيقة، ${ptsText(t)}${t.bonus?'، تميّز +'+t.bonus:''}${t.speed?'، ⚡ '+t.speed+' دقيقة':''}${t.rate?'، ⭐ تقييم الأهل':''}${Object.keys(t.times||{}).length?'، مواعيد مختلفة':''}<br>${t.kids.map(id=>kidById(id)?AV(kidById(id),'mini'):'').join(' ')} ${t.days.length===7?'كل يوم':t.days.map(d=>DAYS[d]).join('، ')}</span></span>
    <button class="btn ghost" onclick="editTask('${t.id}')">تعديل</button></div>`).join('');

function editTask(id,day){
  const t=id?S.tasks.find(x=>x.id===id):{emoji:'⭐',title:'',time:'16:00',dur:15,points:Object.fromEntries(S.kids.map(k=>[k.id,10])),bonus:0,read:'',speed:0,speedPts:0,rate:false,times:{},kids:S.kids.map(k=>k.id),days:day!=null?[day]:[0,1,2,3,4,5,6]};

  <div class="f">الأيام<div class="checks">${DAYS.map((d,i)=>`<label><input type="checkbox" class="fy" value="${i}" ${t.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>
  <details class="f" ${Object.keys(t.times||{}).length?'open':''}><summary>ميعاد مختلف لأيام معينة</summary><p class="muted" style="margin:4px 0">سيبها فاضية لو الميعاد زي الأساسي.</p><div class="dtimes">${DAYS.map((d,i)=>`<label>${d}<input type="time" id="ftm${i}" value="${t.times?.[i]||''}"></label>`).join('')}</div></details>

}
function saveTask(id){
  const v=x=>document.getElementById(x).value,title=v('ft').trim();if(!title){toast('اكتب اسم المهمة');return}
  const kids=[...document.querySelectorAll('.fk:checked')].map(e=>e.value),days=[...document.querySelectorAll('.fy:checked')].map(e=>+e.value);
  if(!kids.length||!days.length){toast('اختار طفل ويوم على الأقل');return}
  const points={};S.kids.forEach(k=>points[k.id]=Math.max(0,+v('fp_'+k.id)||0));
  const time=v('fm')||'16:00',times={};for(let i=0;i<7;i++){const x=v('ftm'+i);if(x&&x!==time&&days.includes(i))times[i]=x}
  const d={emoji:v('fe')||'⭐',title,time,times,dur:Math.max(1,+v('fd')||15),points,bonus:Math.max(0,+v('fb')||0),speed:Math.max(0,+v('fs')||0),speedPts:Math.max(0,+v('fsp')||0),rate:document.getElementById('fq').checked,read:v('fr'),kids,days};
  if(id)Object.assign(S.tasks.find(x=>x.id===id),d);else S.tasks.push({id:uid(),...d});
  save();closeDlg();render();
}
function delTask(id){if(!confirm(tr('تحذف المهمة دي؟')))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();closeDlg();render()}
function pRw(){
  const list=kind=>S[kind].map(r=>`<div class="card row"><span class="grow">${esc(r.emoji)} ${esc(r.title)} <span class="muted">(${r.num>0&&kind==='behaviors'?'+':''}${r.num}${kind==='rewards'?' نقطة':''})</span></span><button class="btn ghost" onclick="editItem('${kind}','${r.id}')">تعديل</button></div>`).join('');
  return `<h3 style="margin-top:0">المكافآت</h3><div class="list">${list('rewards')}</div><button class="btn" style="margin-top:8px" onclick="editItem('rewards')">+ مكافأة</button>
  <h3>🍔 وجبة المدرسة</h3><div class="card"><p class="muted" style="margin-top:0">فلوس بتتصرف يوم ${DAYS[S.meal.day]} لأي ولد التزامه آخر ٧ أيام وصل النسبة دي أو أكتر. مش بتتخصم من النقط.</p>
  <div class="row"><label class="f grow">المبلغ (جنيه)<input id="ma" type="number" value="${S.meal.amount}"></label><label class="f grow">أقل نسبة التزام %<input id="mp" type="number" value="${S.meal.pct}"></label></div><button class="btn" onclick="mealSave()">حفظ</button></div>
  <h3>سلوكيات الثواب والعقاب</h3><p class="muted">الرقم الموجب ثواب، والسالب خصم.</p><div class="list">${list('behaviors')}</div><button class="btn" style="margin-top:8px" onclick="editItem('behaviors')">+ سلوك</button>
  <h3>الرتب</h3><div class="card muted">${RANKS.map(r=>r[1]+' '+r[2]+': '+r[0]+'+ نقطة').join('<br>')}<br>الرتبة بتتحسب من كل النقط اللي الطفل كسبها، فمش بتنزل لما يصرف أو يتخصم منه.</div>`;
}
function editItem(kind,id){
  const r=id?S[kind].find(x=>x.id===id):{emoji:'⭐',title:'',num:kind==='rewards'?50:10};
  openDlg(`<h2>${kind==='rewards'?'مكافأة':'سلوك'}</h2><div class="row"><label class="f" style="width:80px">رمز<input id="ie" value="${esc(r.emoji)}" maxlength="4"></label><label class="f grow">الاسم<input id="it" value="${esc(r.title)}"></label></div>
  <label class="f">${kind==='rewards'?'التمن بالنقط':'النقط (+ أو -)'}<input id="in" type="number" value="${r.num}"></label>
  <div class="row"><button class="btn" onclick="saveItem('${kind}','${id||''}')">حفظ</button><button class="btn ghost" onclick="closeDlg()">إلغاء</button>${id?`<button class="btn bad" style="margin-inline-start:auto" onclick="delItem('${kind}','${id}')">حذف</button>`:''}</div>`);
}
function saveItem(kind,id){const title=document.getElementById('it').value.trim(),num=parseInt(document.getElementById('in').value,10);if(!title||!num){toast('اكتب الاسم والنقط');return}
  const d={emoji:document.getElementById('ie').value||'⭐',title,num:kind==='rewards'?Math.abs(num):num};
  if(id)Object.assign(S[kind].find(x=>x.id===id),d);else S[kind].push({id:uid(),...d});save();closeDlg();render()}
function delItem(kind,id){if(!confirm(tr('تحذفها؟')))return;S[kind]=S[kind].filter(x=>x.id!==id);save();closeDlg();render()}
function pRep(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  return S.kids.map(k=>{
    const earned=days.map(d=>S.history.filter(h=>h.kid===k.id&&h.d===dkey(d)&&h.pts>0).reduce((s,h)=>s+h.pts,0));
    const lost=S.history.filter(h=>h.kid===k.id&&h.pts<0&&!h.reason.startsWith('مكافأة')&&days.some(d=>dkey(d)===h.d)).reduce((s,h)=>s+h.pts,0);
    const pcts=days.map(d=>dayPct(k,d)).filter(p=>p!==null),avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length*100):0;
    const prayers=S.tasks.filter(t=>t.title.startsWith('صلاة')&&t.kids.includes(k.id));
    const pDone=days.reduce((s,d)=>s+prayers.filter(t=>st(k.id,t.id,dkey(d))==='done').length,0);
    const mx=Math.max(10,...earned),R=rank(k),wks=days.map(dkey),sps=Object.entries(S.speed).filter(([key])=>{const[a,b]=key.split('|');return b===k.id&&wks.includes(a)}).map(([,v])=>v),best=sps.length?mmss(Math.min(...sps)):'';
    return `<div class="card" style="--c:${k.color};margin-bottom:10px"><div class="row"><span class="grow">${kidTag(k)} <span class="muted">${R.r[1]} ${R.r[2]}</span></span><span>💰 ${k.points}</span><span>🔥 ${streak(k)}</span></div>
    <div class="muted">الأسبوع ده: التزام ${avg}%، صلوات ${pDone}/${prayers.length*7}، كسب ${earned.reduce((a,b)=>a+b,0)}، خصم ${Math.abs(lost)}${best?'، أسرع جاهزية '+best:''}</div>
    <div class="chart">${earned.map((e,i)=>`<div><span>${e||''}</span><i style="height:${Math.round(e/mx*70)}px"></i><span>${L(DAYS[days[i].getDay()].slice(0,3),DAYS_EN[days[i].getDay()].slice(0,3))}</span></div>`).join('')}</div></div>`}).join('');
}
function pSet(){
  const kids=S.kids.map((k,i)=>`<div class="card" style="margin-bottom:8px"><div class="row"><label class="f" style="width:70px">رمز<input id="sa${i}" value="${esc(k.avatar)}" maxlength="4"></label><label class="f grow">الاسم<input id="sn${i}" value="${esc(k.name)}"></label><label class="f" style="width:80px">السن<input id="sg${i}" type="number" value="${k.age}"></label></div>
  <div class="row">${AV(k,'av')}<label class="btn ghost">📷 تغيير الصورة<input type="file" accept="image/*" hidden onchange="setPhoto(${i},this)"></label>${S.photos?.[k.id]?`<button class="btn ghost" onclick="delPhoto(${i})">شيل الصورة</button>`:''}</div></div>`).join('');
  return `<h3 style="margin-top:0" class="raw">اللغة / Language</h3><div class="card row"><button class="btn raw" onclick="setLang()">${L('English','عربي')}</button></div><h3>الأولاد</h3>${kids}<button class="btn" onclick="saveKids()">حفظ الأسماء</button>
  <h3>الرقم السري</h3><div class="card row"><input id="np" type="password" inputmode="numeric" maxlength="4" class="grow" placeholder="٤ أرقام جديدة"><button class="btn" onclick="savePin()">تغيير</button></div>
  <h3>الجهاز ده</h3><div class="card row"><span class="grow muted">${DEV==='p'?'جهاز الأهل ('+esc(SENDER)+')':'جهاز '+esc(kidById(DEV)?.name||'')}</span><button class="btn ghost" onclick="setDevice('');go('setup')">تغيير</button><button class="btn bad" onclick="if(confirm(tr('تخرج من حساب العيلة على الجهاز ده؟')))logout()">خروج من الحساب</button></div>
  <h3>بداية من جديد</h3><div class="card row"><span class="grow muted">يمسح كل النقط والسجل ويرجّع المهام الأصلية.</span><button class="btn bad" onclick="resetAll()">مسح الكل</button></div>`;
}
function saveKids(){S.kids.forEach((k,i)=>{k.avatar=document.getElementById('sa'+i).value||k.avatar;k.name=document.getElementById('sn'+i).value.trim()||k.name;k.age=+document.getElementById('sg'+i).value||k.age});save();render();toast('اتحفظ')}
function setPhoto(i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const z=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-z)/2,(img.height-z)/4,z,z,0,0,240,240);S.photos[S.kids[i].id]=c.toDataURL('image/jpeg',.75);save();render();toast('الصورة اتحفظت')};img.src=r.result};r.readAsDataURL(f)}
function delPhoto(i){delete S.photos[S.kids[i].id];save();render()}
function savePin(){const p=document.getElementById('np').value;if(!/^\d{4}$/.test(p)){toast('لازم ٤ أرقام');return}S.pin=p;save();toast('الرقم السري اتغير')}
function resetAll(){if(!confirm(tr('متأكد؟ كل حاجة هتتمسح.')))return;S=seed();prepare();save();go('home')}

const dlg=document.getElementById('dlg');
function openDlg(h){document.getElementById('dlgBody').innerHTML=h;trDom(document.getElementById('dlgBody'));if(!dlg.open)dlg.showModal();document.getElementById('dlgBody').scrollTop=0}
function closeDlg(){dlg.close()}

function vBoot(){
  if(view.name==='login')return `<div class="pin"><h1>يومي</h1><p class="muted" style="text-align:center">سجّل دخول بحساب العيلة. ده بيتعمل مرة واحدة بس على الجهاز ده.</p>
    <div class="card" style="width:100%;max-width:380px"><label class="f">الإيميل<input id="le" type="email" autocomplete="username" dir="ltr"></label><label class="f">الباسورد<input id="lp" type="password" autocomplete="current-password" dir="ltr"></label>
    <button class="btn" style="width:100%;padding:12px" onclick="doLogin()">دخول</button></div></div>`;
  if(view.name==='err')return `<div class="pin"><h1>يومي</h1><div class="card" style="max-width:380px">${esc(view.arg||'')}</div><div class="row"><button class="btn" onclick="location.reload()">جرّب تاني</button><button class="btn ghost" onclick="logout()">خروج من الحساب</button></div></div>`;
  return `<div class="pin"><h1>يومي</h1><p class="muted">جاري التحميل...</p></div>`;
}
function vSetup(){
  return `<h1>يومي</h1><h2 style="margin-top:8px">الجهاز ده بتاع مين؟</h2><p class="muted">بتختار مرة واحدة بس، والأولاد مش هيقدروا يغيّروه من غير الرقم السري.</p>
  <label class="f">الرقم السري للأهل<input id="sp" type="password" inputmode="numeric" maxlength="4"></label>
  <div class="kids">${S.kids.map(k=>`<button class="kid" style="--c:${k.color}" onclick="pickDev('${k.id}')">${AV(k,'av')}<span class="nm">${esc(k.name)}</span><span class="meta">جهاز ${esc(k.name)}</span></button>`).join('')}
  <button class="kid" style="--c:var(--accent)" onclick="pickDev('p','بابا')"><span class="av">👨</span><span class="nm">بابا</span><span class="meta">لوحة الأهل</span></button>
  <button class="kid" style="--c:#B4467A" onclick="pickDev('p','ماما')"><span class="av">👩</span><span class="nm">ماما</span><span class="meta">لوحة الأهل</span></button></div>
  <div class="card muted" style="margin-top:16px">💡 عشان يفتح زي التطبيق: من Safari دوس زرار المشاركة واختار «Add to Home Screen».</div>`;
}
function pickDev(id,who){const p=document.getElementById('sp').value;if(p!==S.pin){toast('الرقم غلط');return}setDevice(id);if(who){SENDER=who;try{localStorage.setItem('yawmi-sender',who)}catch(e){}}go('home')}
function doLogin(){const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;if(!e||!p){toast('اكتب الإيميل والباسورد');return}
  firebase.auth().signInWithEmailAndPassword(e,p).catch(()=>toast('الإيميل أو الباسورد غلط'))}
function logout(){try{firebase.auth().signOut()}catch(e){}setDevice('');S=null;base=null;ready=false;view={name:'login'};render()}
function softRender(){const a=document.activeElement?.tagName;if(dlg.open||a==='INPUT'||a==='SELECT'||a==='TEXTAREA'){pendingRender=true;return}pendingRender=false;render()}
dlg.addEventListener('close',()=>{if(pendingRender)softRender()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)softRender()},300));
document.addEventListener('click',()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function render(){
  const app=document.getElementById('app');
  document.documentElement.lang=L('ar','en');document.documentElement.dir=L('rtl','ltr');
  if(!S||['login','loading','err'].includes(view.name)){app.innerHTML=vBoot();trDom(app);return}
  if(!DEV&&view.name!=='setup')view={name:'setup'};
  if(view.name==='home'&&DEV&&DEV!=='p'&&kidById(DEV))view={name:'kid',arg:DEV};
  avCSS();app.innerHTML=view.name==='setup'?vSetup():
view.name==='kid'?vKid(view.arg):view.name==='pin'?vPin():view.name==='parent'?vParent(view.arg||'ok'):vHome();
  trDom(app);updTimers();document.querySelectorAll('.chat').forEach(e=>e.scrollTop=e.scrollHeight);
}
function tick(){
  if(!S)return;
  if(view.name==='kid'){const k=kidById(view.arg),n=nowM(),key=today();
    kidTasks(k).forEach(t=>{if(st(k.id,t.id)||t.rate||!P(t,k.id)&&!t.title.includes('تمرين'))return;const tm=m(T(t));
      [[tm-5,'pre','⏰ بعد ٥ دقايق: '],[tm,'now','⏰ دلوقتي وقت: ']].forEach(([w,tag,txt])=>{const id=key+k.id+t.id+tag;
        if(n>=w&&n<w+3&&!NOTI[id]){NOTI[id]=1;saveNoti();remind(txt+t.emoji+' '+t.title)}})});
    checkMsgs(k.id);if(!dlg.open&&document.activeElement?.tagName!=='INPUT')render()}
  else if(view.name==='home')render();
}

function onErr(e){console.error(e);S=null;view={name:'err',arg:e&&e.code==='permission-denied'?'الحساب ده مش مسموح له يفتح بيانات العيلة. اتأكد إنك داخل بإيميل حساب العيلة.':'حصلت مشكلة في الاتصال بالسيرفر. اتأكد من الإنترنت وجرّب تاني.'};render()}
async function initRemote(){try{S=seed();prepare();const cur=clean(S),ph=cur.photos||{};delete cur.photos;
  await fdb.runTransaction(async tx=>{const x=await tx.get(mainRef);if(!x.exists){tx.set(mainRef,cur);tx.set(photoRef,ph)}})}catch(e){onErr(e)}}
function onMain(snap){
  if(!snap.exists){if(!snap.metadata.fromCache)initRemote();return}
  S=snap.data();S.photos=lastPhotos;base=clean(S);prepare();ready=true;save();
  if(['loading','login','err'].includes(view.name))view={name:'home'};
  if(view.name==='kid')checkMsgs(view.arg);
  softRender();
}
function onPhotos(snap){lastPhotos=snap.exists?snap.data():{};if(S){S.photos=lastPhotos;if(base)base.photos=clean(lastPhotos);softRender()}}
function boot(){
  if(!window.firebase){view={name:'err',arg:'مش قادر يحمّل التطبيق. اتأكد من الإنترنت وجرّب تاني.'};render();return}
  firebase.initializeApp(FB_CFG);fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  mainRef=fdb.collection('family').doc('main');photoRef=fdb.collection('family').doc('photos');
  firebase.auth().onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];
    if(!u){S=null;base=null;ready=false;view={name:'login'};render();return}
    view={name:'loading'};render();
    unsubs.push(mainRef.onSnapshot(onMain,onErr));unsubs.push(photoRef.onSnapshot(onPhotos,e=>console.error(e)));
  });
}
view={name:'loading'};render();boot();
